name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-apk
          path: TV.apk
      - name: İndirme linkini güncelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          NAME=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TV.apk --title "TV $NAME (son sürüm)" \
            --notes "TV'de Downloader ile: https://github.com/${{ github.repository }}/releases/download/latest/TV.apk
          versionCode=$CODE versionName=$NAME"
