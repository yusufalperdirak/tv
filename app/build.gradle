plugins {
    id 'com.android.application'
}

// Uzaktan kanal listesi: GitHub'da derlenirken depo adı otomatik alınır.
// Android Studio'da derliyorsan gradle.properties içine channelsRepo=kullaniciadi/depo yaz.
def repo = System.getenv("GITHUB_REPOSITORY") ?: (project.findProperty("channelsRepo") ?: "")
def listUrl = repo ? "https://raw.githubusercontent.com/${repo}/HEAD/app/src/main/assets/channels.m3u" : ""

android {
    namespace 'com.turktv.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.turktv.app'
        minSdk 23
        // 33: otomatik açılış servisinin eski/yeni tüm Android TV'lerde sorunsuz çalışması için
        targetSdk 33
        versionCode 33
        versionName '7.1.3'
        buildConfigField "String", "CHANNELS_URL", "\"${listUrl}\""
        buildConfigField "String", "REPO", "\"${repo}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Sabit imza anahtarı: her derleme aynı anahtarla imzalanır, böylece yeni sürüm
    // TV'de eskisinin üzerine (ayarlar ve favoriler silinmeden) güncelleme olarak kurulur.
    // Sadece bu kişisel, Play Store dışı uygulama içindir.
    signingConfigs {
        tv {
            storeFile rootProject.file('signing/tv.jks')
            storePassword 'tvuygulamasi'
            keyAlias 'tv'
            keyPassword 'tvuygulamasi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // M3U listesindeki yayınlar için video oynatıcı (Google ExoPlayer / Media3)
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
